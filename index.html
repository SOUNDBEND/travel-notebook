<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>彎彎腰の旅手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --card:#FFFFFF; --ink:#3E3A39; --muted:#6B6563;
  --coral:#F2A497; --yellow:#F6D27A; --mizu:#A8D3E6; --green:#B9DAA5;
  --r-xl:32px; --r-lg:24px; --r-md:18px;
  --nav-h:62px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper);scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--nav-h) + 14px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Huninn","jf-openhuninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 頂端選單 ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
.nav-in{max-width:680px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:6px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav-logo{flex:none;width:40px;height:40px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:50%;background:var(--coral);text-decoration:none}
.nav a.link{flex:none;text-decoration:none;padding:5px 13px;border:3px solid transparent;border-radius:999px;font-size:15px;white-space:nowrap}
.nav a.link.on{background:var(--yellow);border-color:var(--ink)}

/* ---------- 版面 ---------- */
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
section{margin:44px 0}
.sec-h{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:24px;font-weight:normal;letter-spacing:.06em}
.sec-h .ic{flex:none;width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.sec-h small{font-size:14px;color:var(--muted);letter-spacing:0;margin-left:auto}
.card{background:var(--card);border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink);padding:18px}

/* ---------- 首頁 ---------- */
.hero{padding-top:18px}
.hero-art{border:3px solid var(--ink);border-radius:var(--r-xl);background:var(--card);overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.hero-art svg{display:block;width:100%;height:auto}
.hero h1{font-size:clamp(40px,12vw,58px);font-weight:normal;line-height:1.15;margin:22px 0 4px;letter-spacing:.08em}
.hero .sub{margin:0;font-size:18px;color:var(--muted)}
.date-chip{display:inline-block;margin-top:12px;padding:3px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--mizu);font-size:15px}
.cd{margin-top:22px}
.cd-label{margin:0 0 10px;font-size:16px}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd-tile{border:3px solid var(--ink);border-radius:var(--r-md);text-align:center;padding:10px 0 6px}
.cd-tile b{display:block;font-weight:normal;font-size:clamp(26px,8vw,36px);line-height:1.1;font-variant-numeric:tabular-nums}
.cd-tile span{font-size:13px}
.cd-msg{border:3px solid var(--ink);border-radius:var(--r-md);background:var(--green);padding:14px 16px;font-size:18px}

.switch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.switch span.lbl{font-size:14px;color:var(--muted);margin-right:2px}
.sw{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:4px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-size:15px}
.sw[aria-pressed="true"]{background:var(--green)}
.sw:active{transform:translateY(3px);box-shadow:none}
.sw em{font-style:normal;font-size:12px;padding:0 7px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.hero-art.pop,.hero-text.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.hero-text.pop{animation-delay:.08s}

/* ---------- 航班 ---------- */
.flights{display:grid;gap:18px}
.pass{position:relative;padding:0;overflow:visible}
.pass-top{display:flex;align-items:center;gap:8px;padding:14px 18px 0}
.pill{display:inline-block;padding:1px 12px;border:2.5px solid var(--ink);border-radius:999px;font-size:14px}
.pass-top .no{margin-left:auto;font-size:15px;color:var(--muted)}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 18px 16px}
.port b{display:block;font-weight:normal;font-size:38px;line-height:1.05;letter-spacing:.04em}
.port span{font-size:14px;color:var(--muted)}
.port .t{display:block;font-size:20px;color:var(--ink);margin-top:2px}
.port.r{text-align:right}
.route svg{width:100%;height:40px}
.pass-cut{position:relative;border-top:3px dashed var(--ink);margin:0 18px}
.pass-cut::before,.pass-cut::after{content:"";position:absolute;top:-14px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.pass-cut::before{left:-33px;clip-path:inset(0 0 0 50%)}
.pass-cut::after{right:-33px;clip-path:inset(0 50% 0 0)}
.pass-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px 16px;font-size:14px}
.pass-info dt{color:var(--muted);font-size:12.5px}
.pass-info dd{margin:0}

/* ---------- 每日行程 ---------- */
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 64px;min-width:64px;border:3px solid var(--ink);border-radius:var(--r-md);background:var(--card);padding:6px 4px 6px;cursor:pointer;text-align:center;line-height:1.25;box-shadow:0 4px 0 var(--ink);transition:transform .15s}
.tab small{display:block;font-size:12px;color:var(--muted)}
.tab b{display:block;font-weight:normal;font-size:20px}
.tab[aria-selected="true"]{background:var(--yellow);transform:translateY(-3px)}
.tab[aria-selected="true"] small{color:var(--ink)}
.tab.boing{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}

.day-head{display:flex;align-items:center;gap:14px;padding:12px 16px}
.day-head svg{flex:none;width:112px;height:auto}
.day-head h3{margin:0;font-size:22px;font-weight:normal;line-height:1.3}
.day-head p{margin:2px 0 0;font-size:14px;color:var(--muted)}

.tl{list-style:none;margin:22px 0 0;padding:0}
.tl-item{display:grid;grid-template-columns:48px 22px 1fr;gap:0 8px;position:relative}
.tl-time{text-align:right;padding-top:13px;font-size:16px;font-variant-numeric:tabular-nums}
.tl-rail{position:relative}
.tl-rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--ink);transform:translateX(-50%)}
.tl-item:first-child .tl-rail::before{top:20px}
.tl-item:last-child .tl-rail::before{bottom:auto;height:20px}
.tl-dot{position:absolute;left:50%;top:14px;width:18px;height:18px;margin-left:-9px;border:3px solid var(--ink);border-radius:50%;background:var(--card)}
.tl-card{position:relative;margin-bottom:16px;padding:11px 14px 12px;border:3px solid var(--ink);border-radius:var(--r-md);background:var(--card)}
.tl-card h4{margin:0;font-size:17.5px;font-weight:normal;line-height:1.4}
.tl-card p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.tl-card.must{background:#FFF6F3;padding-right:62px}
.stamp{position:absolute;top:-12px;right:-8px;width:54px;height:54px;border:3px solid var(--ink);border-radius:50%;background:var(--coral);display:grid;place-items:center;font-size:15px;transform:rotate(-12deg)}
.stamp::after{content:"";position:absolute;inset:4px;border:2px dashed var(--ink);border-radius:50%}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 10px 1px 6px;border:2.5px solid var(--ink);border-radius:999px;font-size:13px;line-height:1.5}
.tag svg{width:15px;height:15px}

.day-panel.pop .day-head,.day-panel.pop .tl-item{animation:pop .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i,0) * 55ms)}

/* ---------- 住宿 ---------- */
.stays{display:grid;gap:18px}
.stay-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.stay-top svg{flex:none;width:56px;height:56px}
.stay h3{margin:0;font-size:19px;font-weight:normal;line-height:1.35}
.stay-top p{margin:0;font-size:14px;color:var(--muted)}
.stay dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
.stay dt{color:var(--muted)}
.stay dd{margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 16px;border:3px solid var(--ink);border-radius:999px;background:var(--mizu);text-decoration:none;font-size:15px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:none}

/* ---------- 清單 ---------- */
.list-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar{flex:1;height:16px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.count{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.reset{border:0;background:none;padding:2px 4px;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
.checks{list-style:none;margin:0;padding:0}
.checks li+li{border-top:2px dashed #D8D2CC}
.check{display:flex;align-items:center;gap:12px;padding:10px 2px;cursor:pointer}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:28px;height:28px;border:3px solid var(--ink);border-radius:9px;background:var(--card);display:grid;place-items:center}
.box svg{width:18px;height:18px;opacity:0}
.check input:checked+.box{animation:boing .45s cubic-bezier(.3,1.6,.5,1)}
.check input:checked+.box svg{opacity:1}
.check input:checked~.txt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.check input:focus-visible+.box{outline:3px dashed var(--ink);outline-offset:3px}
.txt{flex:1}
.note{font-size:13px;color:var(--muted);margin-left:6px}
.grp{margin:16px 0 4px;display:flex;align-items:center;gap:8px;font-size:16px}
.grp i{width:14px;height:14px;border:2.5px solid var(--ink);border-radius:50%}
.grp:first-of-type{margin-top:4px}

footer{text-align:center;padding:10px 0 40px;color:var(--muted);font-size:14px}
footer svg{width:150px;height:auto;display:block;margin:0 auto 6px}

/* ---------- 動畫 ---------- */
@keyframes pop{0%{opacity:0;transform:translateY(18px) scale(.96)}55%{opacity:1;transform:translateY(-6px) scale(1.01)}80%{transform:translateY(2px)}100%{opacity:1;transform:none}}
@keyframes boing{0%{transform:scale(1)}35%{transform:scale(.85)}65%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes snow{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(70px);opacity:0}}
@keyframes nod{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(14deg)}90%{transform:rotate(0)}}
svg .a{transform-box:fill-box;transform-origin:center}
.a-drift{animation:drift 7s ease-in-out infinite alternate}
.a-drift2{animation:drift 9s ease-in-out -3s infinite alternate-reverse}
.a-spin{animation:spin 40s linear infinite}
.a-bob{animation:bob 1.1s ease-in-out infinite}
.a-float{animation:float 3s ease-in-out infinite}
.a-sway{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%!important}
.a-swing{animation:sway 3.5s ease-in-out infinite;transform-origin:50% 0!important}
.a-snow{animation:snow 6s linear infinite}
.a-nod{animation:nod 4s ease-in-out infinite;transform-origin:20% 90%!important}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .a-snow{opacity:1}
}
@media (min-width:720px){
  .flights,.stays{grid-template-columns:1fr 1fr}
  .hero{display:grid;grid-template-columns:1.15fr 1fr;gap:0 26px;align-items:center;padding-top:30px}
  .switch{grid-column:1/-1}
  .hero h1{margin-top:0}
}
</style>
</head>
<body>

<header class="nav">
  <nav class="nav-in" aria-label="頁面選單">
    <a class="nav-logo" href="#top" aria-label="回到首頁">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6 Q12 2 22 6 V9 Q12 5 2 9Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/><path d="M6 8 V22 M18 8 V22 M4 12 H20" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round"/></svg>
    </a>
    <a class="link" href="#top">首頁</a>
    <a class="link" href="#flight">航班</a>
    <a class="link" href="#plan">行程</a>
    <a class="link" href="#todo">待辦</a>
    <a class="link" href="#stay">住宿</a>
    <a class="link" href="#prep">出發前</a>
    <a class="link" href="#pack">行李</a>
  </nav>
</header>

<main class="wrap">
  <section id="top" class="hero" style="margin-top:0">
    <div class="switch" role="group" aria-label="切換旅程" id="switch"></div>
    <div class="hero-art" id="heroArt" role="img"></div>
    <div class="hero-text" id="heroText">
      <h1 id="tripTitle"></h1>
      <p class="sub" id="tripSub"></p>
      <span class="date-chip" id="tripDates"></span>
      <div class="cd" id="countdown" aria-live="polite"></div>
    </div>
  </section>

  <section id="flight">
    <h2 class="sec-h"><span class="ic" style="background:var(--coral)" data-icon="plane"></span>航班</h2>
    <div class="flights" id="flights"></div>
  </section>

  <section id="plan">
    <h2 class="sec-h"><span class="ic" style="background:var(--yellow)" data-icon="cal"></span>每日行程</h2>
    <div class="tabs" role="tablist" aria-label="選擇日期" id="tabs"></div>
    <div class="day-panel" role="tabpanel" id="dayPanel" tabindex="-1"></div>
  </section>

  <section id="todo">
    <h2 class="sec-h"><span class="ic" style="background:var(--coral)" data-icon="star"></span>旅途待辦</h2>
    <div class="card" data-list="todo"></div>
  </section>

  <section id="stay">
    <h2 class="sec-h"><span class="ic" style="background:var(--green)" data-icon="house"></span>住宿</h2>
    <div class="stays" id="stays"></div>
  </section>

  <section id="prep">
    <h2 class="sec-h"><span class="ic" style="background:var(--mizu)" data-icon="clip"></span>出發前清單</h2>
    <div class="card" data-list="prep"></div>
  </section>

  <section id="pack">
    <h2 class="sec-h"><span class="ic" style="background:var(--yellow)" data-icon="bag"></span>行李清單</h2>
    <div class="card" data-list="pack"></div>
  </section>
</main>

<footer id="foot"></footer>

<script>
/* =========================================================
   旅程資料：每一趟旅程是 TRIPS 裡的一個物件，改這裡就好
   move：plane 飛機 / train 電車 / subway 地鐵 / bus 巴士 / walk 步行
   must:true 會蓋「必去」印章
   art（當天插圖）：plane torii bamboo deer castle lantern ski snowman fuji dog tower
   hero（首頁插圖）：tokyo / kansai
   ========================================================= */

  lists: {
    todo: [
      { text:"12月18日至20日 住宿未填", note:"行事曆未填" },
      { text:"Belken Hotel Kanda 退房日為 12月24日，但 12月23日 18:55 已有酷航回程", note:"行事曆未填" },
      { text:"酷航去程未寫航班代號與抵達機場", note:"行事曆未填" },
      { text:"酷航回程未寫航班代號與抵達地", note:"行事曆未填" }
    ],
    prep: [],
    pack: []
  }
},

/* ========================================================= */
const INK = "#3E3A39", WHITE = "#FFFFFF";
const C = { coral:"#F2A497", yellow:"#F6D27A", mizu:"#A8D3E6", green:"#B9DAA5", paper:"#FFFCF6" };
const S = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"`;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

/* ---------- 插圖零件 ---------- */
const cloud = (x,y,s,cls) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="a ${cls}"><path d="M0 30 H78 A13 13 0 0 0 66 10 A17 17 0 0 0 36 4 A15 15 0 0 0 10 14 A11 11 0 0 0 0 30Z" fill="${WHITE}" ${S}/></g></g>`;

const torii = (x,y,s) => `<g transform="translate(${x} ${y}) scale(${s})">
  <rect x="7" y="10" width="6" height="40" rx="1.5" fill="${C.coral}" ${S}/>
  <rect x="37" y="10" width="6" height="40" rx="1.5" fill="${C.coral}" ${S}/>
  <rect x="2" y="16" width="46" height="6" rx="2" fill="${C.coral}" ${S}/>
  <path d="M-4 4 Q25 -2 54 4 L52 11 Q25 6 -2 11Z" fill="${C.coral}" ${S}/>
  <rect x="22" y="10" width="6" height="6" fill="${C.coral}" ${S}/>
</g>`;

function pagoda(cx, base){
  const r = i => base - 20 - i*24;
  let bodies = "", roofs = "";
  for (let i=0;i<5;i++){
    const w = 86 - i*12, bw = Math.round(w*0.44);
    const top = r(i), bottom = i===0 ? base : r(i-1)-10;
    bodies += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${bottom-top}" fill="${C.paper}" ${S}/>`;
    bodies += `<rect x="${cx-4}" y="${top+4}" width="8" height="${Math.max(bottom-top-6,4)}" rx="2" fill="${C.mizu}" stroke="${INK}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    roofs += `<path d="M${cx-w/2} ${top} Q${cx-w/2+8} ${top-3} ${cx-w/2+12} ${top-11} H${cx+w/2-12} Q${cx+w/2-8} ${top-3} ${cx+w/2} ${top}Z" fill="${C.coral}" ${S}/>`;
  }
  const t = r(4)-11;
  const spire = `<line x1="${cx}" y1="${t}" x2="${cx}" y2="${t-30}" ${S}/>` +
    [6,13,20].map(d=>`<circle cx="${cx}" cy="${t-d}" r="4" fill="${C.yellow}" ${S}/>`).join("");
  return `<g>${spire}${bodies}${roofs}</g>`;
}

// 東京鐵塔：原點在底部中央，往上畫
const tower = `
  <line x1="0" y1="-134" x2="0" y2="-164" ${S}/>
  <circle cx="0" cy="-166" r="3.5" fill="${C.yellow}" ${S}/>
  <path d="M-25 0 Q-9 -48 -5 -134 H5 Q9 -48 25 0Z" fill="${C.coral}" ${S}/>
  <path d="M-14 0 Q0 -30 14 0Z" fill="${WHITE}" ${S}/>
  <rect x="-13" y="-46" width="26" height="6" fill="${WHITE}" ${S}/>
  <rect x="-17" y="-84" width="34" height="13" rx="3" fill="${WHITE}" ${S}/>
  <rect x="-9" y="-120" width="18" height="9" rx="3" fill="${WHITE}" ${S}/>`;

// 雪人：原點在底部中央
const snowman = `
  <line x1="-10" y1="-34" x2="-24" y2="-44" ${S}/><line x1="10" y1="-34" x2="24" y2="-46" ${S}/>

/* ---------- 狀態（存在這台裝置） ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let checks = store.get("trip-checks-v2", null);
if (!checks){  // 把舊版京阪清單的勾選紀錄搬過來
  const old = store.get("trip-checks-v1", {}); checks = {};
  Object.keys(old).forEach(k=>{ if (old[k]) checks["kansai:"+k] = true; });
}
let trip = TRIPS.find(t=>t.id === store.get("trip-current", "")) || TRIPS[0];

/* ---------- 切換旅程 ---------- */
const switchEl = document.getElementById("switch");
switchEl.innerHTML = `<span class="lbl">我的旅程</span>` + TRIPS.map(t=>
  `<button class="sw" type="button" data-id="${t.id}" aria-pressed="false">${esc(t.label)}${t.tag?`<em>${esc(t.tag)}</em>`:""}</button>`).join("");
switchEl.addEventListener("click", e=>{
  const b = e.target.closest(".sw"); if (!b || b.dataset.id === trip.id) return;
  trip = TRIPS.find(t=>t.id === b.dataset.id);
  store.set("trip-current", trip.id);
  renderTrip(true);
});

/* ---------- 首頁與倒數 ---------- */
const cdEl = document.getElementById("countdown");
const tiles = [["天",C.coral],["時",C.yellow],["分",C.mizu],["秒",C.green]];
let cdMode = null;
function tick(){
  const now = Date.now(), s0 = new Date(trip.start).getTime(), e0 = new Date(trip.end).getTime();
  if (now < s0){
    if (cdMode !== "count"){
      cdMode = "count";
      cdEl.innerHTML = `<p class="cd-label">距離出發還有</p><div class="cd-grid">${tiles.map(([u,c])=>`<div class="cd-tile" style="background:${c}"><b>0</b><span>${u}</span></div>`).join("")}</div>`;
    }
    const s = Math.floor((s0-now)/1000);
    const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60];
    cdEl.querySelectorAll(".cd-tile b").forEach((b,i)=>{ b.textContent = i===0 ? v[i] : String(v[i]).padStart(2,"0"); });
  } else if (now < e0){
    if (cdMode !== "on"){ cdMode="on"; const d = Math.floor((now-s0)/86400000)+1; cdEl.innerHTML = `<div class="cd-msg">旅途進行中，今天是第 ${d} 天，玩得開心！</div>`; }
  } else if (cdMode !== "done"){ cdMode="done"; cdEl.innerHTML = `<div class="cd-msg">旅程結束，歡迎回家！</div>`; }
}
setInterval(tick, 1000);

/* ---------- 每日行程 ---------- */
const tabsEl = document.getElementById("tabs"), panel = document.getElementById("dayPanel");
function renderDay(i, animate){
  const d = trip.days[i];
  tabsEl.querySelectorAll(".tab").forEach((t,j)=>{
    const on = j===i; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
  });
  panel.setAttribute("aria-labelledby", `tab-${i}`);
  const head = `<div class="card day-head" style="--i:0">${DAY_ART[d.art]||""}<div><h3>${esc(d.title)}</h3><p>${esc(d.area||"")}</p></div></div>`;
  if (!d.items.length){
    panel.innerHTML = `${head}<div class="cd-msg">行事曆尚無資料</div>`;
    if (animate && !reduceMotion.matches){ replay(panel, "pop"); replay(tabsEl.children[i], "boing"); }
    return;
  }
  panel.innerHTML = `
    ${head}
    <ol class="tl">${d.items.map((it,k)=>{
      const first = it.move && it.move[0];
      return `<li class="tl-item" style="--i:${k+1}">
        <div class="tl-time">${it.t}</div>
        <div class="tl-rail"><span class="tl-dot" style="background:${first?MOVES[first].color:WHITE}"></span></div>
        <div class="tl-card${it.must?" must":""}">
          ${it.must?`<span class="stamp" aria-label="必去">必去</span>`:""}
          <h4>${esc(it.title)}</h4>
          ${it.note?`<p>${esc(it.note)}</p>`:""}
          ${it.move?`<div class="tags">${it.move.map(m=>`<span class="tag" style="background:${MOVES[m].color}"><svg viewBox="0 0 16 16" aria-hidden="true">${MOVES[m].svg}</svg>${MOVES[m].label}</span>`).join("")}</div>`:""}
        </div></li>`;}).join("")}
    </ol>`;
  if (animate && !reduceMotion.matches){
    replay(panel, "pop");
    replay(tabsEl.children[i], "boing");
  }
}
tabsEl.addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if (!t) return;
  renderDay(+t.dataset.i, true);
  t.scrollIntoView({block:"nearest", inline:"center", behavior: reduceMotion.matches ? "auto" : "smooth"});
});
tabsEl.addEventListener("keydown", e=>{
  if (!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const cur = +document.activeElement.dataset.i, n = trip.days.length;
  const next = (cur + (e.key==="ArrowRight"?1:-1) + n) % n;
  renderDay(next, true); tabsEl.children[next].focus();
});

/* ---------- 住宿 ---------- */
const houseArt = c => `<svg viewBox="0 0 56 56" aria-hidden="true">
  <path d="M6 26 L28 8 L50 26 V50 H6Z" fill="${WHITE}" ${S}/>
  <path d="M2 28 L28 6 L54 28 L50 31 L28 13 L6 31Z" fill="${c}" ${S}/>
  <rect x="22" y="34" width="12" height="16" rx="2" fill="${C.yellow}" stroke="${INK}" stroke-width="2.5"/>
  <rect x="12" y="32" width="7" height="7" rx="1.5" fill="${C.mizu}" stroke="${INK}" stroke-width="2"/>
  <rect x="37" y="32" width="7" height="7" rx="1.5" fill="${C.mizu}" stroke="${INK}" stroke-width="2"/></svg>`;

/* ---------- 可打勾清單 ---------- */
const tick18 = `<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9.5 L7.5 14 L15 4.5" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const barColor = { todo:C.coral, prep:C.mizu, pack:C.yellow };
const keyOf = id => `${trip.id}:${id}`;
const item = (id, text, note) => `<li><label class="check"><input type="checkbox" data-id="${id}" ${checks[keyOf(id)]?"checked":""}><span class="box">${tick18}</span><span class="txt">${esc(text)}${note?`<span class="note">${esc(note)}</span>`:""}</span></label></li>`;
function updateList(el){
  const boxes = el.querySelectorAll("input"), done = [...boxes].filter(b=>b.checked).length, pct = boxes.length ? done/boxes.length*100 : 0;
  el.querySelector(".count").textContent = done === boxes.length ? "全部完成！" : `${done} / ${boxes.length}`;
  el.querySelector(".bar i").style.width = pct + "%";
  el.querySelector(".bar").setAttribute("aria-valuenow", Math.round(pct));
}
function renderList(el){
  const name = el.dataset.list, data = trip.lists[name] || [];
  if (!data.length){
    el.innerHTML = `<div class="cd-msg">行事曆尚無資料</div>`;
    return;
  }
  const body = name === "pack"
    ? data.map((g,gi)=>`<div class="grp"><i style="background:${g.color}"></i>${esc(g.group)}</div><ul class="checks">${g.items.map((t,ii)=>item(`pack-${gi}-${ii}`, t)).join("")}</ul>`).join("")
    : `<ul class="checks">${data.map((it,ii)=>item(`${name}-${ii}`, it.text, it.note)).join("")}</ul>`;
  el.innerHTML = `<div class="list-head"><div class="bar" role="progressbar" aria-label="完成進度" aria-valuemin="0" aria-valuemax="100"><i style="background:${barColor[name]}"></i></div><span class="count"></span><button class="reset" type="button">重設</button></div>${body}`;
  updateList(el);
}
document.querySelectorAll("[data-list]").forEach(el=>{
  el.addEventListener("change", e=>{
    const id = e.target.dataset.id; if (!id) return;
    if (e.target.checked) checks[keyOf(id)] = true; else delete checks[keyOf(id)];
    store.set("trip-checks-v2", checks); updateList(el);
  });
  el.addEventListener("click", e=>{
    if (!e.target.closest(".reset")) return;
    el.querySelectorAll("input").forEach(b=>{ b.checked = false; delete checks[keyOf(b.dataset.id)]; });
    store.set("trip-checks-v2", checks); updateList(el);
  });
});

/* ---------- 整趟旅程重畫 ---------- */
function renderTrip(animate){
  document.title = `${trip.title} ${trip.subtitle}`;
  switchEl.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed", b.dataset.id === trip.id));

  const art = document.getElementById("heroArt"), h = HERO[trip.hero] || HERO.tokyo;
  art.innerHTML = h.svg(); art.setAttribute("aria-label", h.label);
  document.getElementById("tripTitle").textContent = trip.title;
  document.getElementById("tripSub").textContent = trip.subtitle;
  document.getElementById("tripDates").textContent = trip.dates;
  cdMode = null; tick();

  document.getElementById("flights").innerHTML = trip.flights.length ? trip.flights.map(f=>`
    <article class="card pass">
      <div class="pass-top">
        <span class="pill" style="background:${f.dir==="去程"?C.coral:C.mizu}">${esc(f.dir)}</span>
        <span>${esc(f.date)}</span>
        <span class="no">${esc(f.airline)}${f.no?"　"+esc(f.no):""}</span>
      </div>
      <div class="route">
        <div class="port"><b>${f.from.code}</b><span>${esc(f.from.city)}</span><span class="t">${f.from.time}</span></div>
        <svg viewBox="0 0 120 40" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <path d="M6 28 Q60 2 114 28" fill="none" stroke="${INK}" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
          <g transform="translate(60 15)"><g class="a a-float"><path d="M-11 2 L11 -6 L7 8 L2 3 L-4 6Z" fill="${C.yellow}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/></g></g>
        </svg>
        <div class="port r"><b>${f.to.code}</b><span>${esc(f.to.city)}</span><span class="t">${f.to.time}</span></div>
      </div>
      <div class="pass-cut"></div>
      <dl class="pass-info">
        <div><dt>飛行時間</dt><dd>${esc(f.dur)}</dd></div>
        <div><dt>航廈</dt><dd>${esc(f.term)}</dd></div>
        <div><dt>行李</dt><dd>${esc(f.bag)}</dd></div>
      </dl>
    </article>`).join("") : `<div class="cd-msg">行事曆尚無資料</div>`;

  if (!trip.days.length){
    tabsEl.innerHTML = "";
    panel.innerHTML = `<div class="cd-msg">行事曆尚無資料</div>`;
  } else {
  tabsEl.innerHTML = trip.days.map((d,i)=>`
    <button class="tab" role="tab" id="tab-${i}" aria-controls="dayPanel" aria-selected="false" tabindex="-1" data-i="${i}">
      <small>第 ${i+1} 天</small><b>${d.date}</b><small>${d.week}</small>
    </button>`).join("");
  let today = 0;
  const now = Date.now(), s0 = new Date(trip.start).getTime(), e0 = new Date(trip.end).getTime();
  if (now >= s0 && now < e0) today = Math.min(Math.floor((now-s0)/86400000), trip.days.length-1);
  renderDay(today, false);
  tabsEl.scrollLeft = 0;
  }

  document.getElementById("stays").innerHTML = trip.stays.length ? trip.stays.map(s=>`
    <article class="card stay">
      <div class="stay-top">${houseArt(s.color)}<div><h3>${esc(s.name)}</h3><p>${esc(s.city)}　${esc(s.nights)}</p></div></div>
      <dl>
        <dt>入住</dt><dd>${esc(s.checkin)}</dd>
        <dt>退房</dt><dd>${esc(s.checkout)}</dd>
        <dt>地址</dt><dd>${esc(s.addr)}</dd>
        <dt>交通</dt><dd>${esc(s.access)}</dd>
        <dt>備註</dt><dd>${esc(s.memo)}</dd>
      </dl>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.map)}" target="_blank" rel="noopener">在地圖上開啟</a>
    </article>`).join("") : `<div class="cd-msg">行事曆尚無資料</div>`;

  document.querySelectorAll("[data-list]").forEach(renderList);

  if (animate && !reduceMotion.matches){
    replay(art, "pop"); replay(document.getElementById("heroText"), "pop");
  }
}
renderTrip(false);

/* ---------- 頁尾 ---------- */
document.getElementById("foot").innerHTML = `<svg viewBox="0 0 150 60" aria-hidden="true">
  <path d="M10 52 H140" ${S}/>
  <g transform="translate(40 8)"><g class="a a-bob">
    <rect x="0" y="10" width="44" height="34" rx="8" fill="${C.coral}" ${S}/>
    <path d="M14 10 V3 H30 V10" fill="none" ${S}/>
    <path d="M0 24 H44" ${S}/>
    <circle cx="10" cy="46" r="4" fill="${WHITE}" stroke="${INK}" stroke-width="2.5"/><circle cx="34" cy="46" r="4" fill="${WHITE}" stroke="${INK}" stroke-width="2.5"/>
  </g></g>
  <g transform="translate(96 16)"><g class="a a-float">
    <path d="M10 0 L12.8 6 L19 6.6 L14.3 10.8 L15.8 17 L10 13.7 L4.2 17 L5.7 10.8 L1 6.6 L7.2 6Z" fill="${C.yellow}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
  </g></g></svg>資料來源：Google 行事曆`;

/* ---------- 選單目前位置 ---------- */
const links = [...document.querySelectorAll(".nav a.link")];
const io = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if (!en.isIntersecting) return;
    links.forEach(a=>a.classList.toggle("on", a.getAttribute("href") === "#"+en.target.id));
    const on = links.find(a=>a.classList.contains("on"));
    if (on) on.scrollIntoView({block:"nearest", inline:"nearest"});
  });
}, { rootMargin:"-35% 0px -60% 0px" });
document.querySelectorAll("main section[id]").forEach(s=>io.observe(s));
</script>
</body>
</html>
